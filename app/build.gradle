plugins {
    id 'com.android.application'
    id 'kotlin-parcelize'
    id 'com.android.legacy-kapt' version '9.4.0'
    id 'com.google.dagger.hilt.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}
def mapsApiKey = localProperties.getProperty('MAPS_API_KEY', '')
if (mapsApiKey.isEmpty()) {
    logger.warn('MAPS_API_KEY is missing from local.properties. Maps/Places will not work until you add it.')
}

android {
    compileSdk 37
    defaultConfig {
        applicationId "com.evya.weatherapp"
        minSdk 26
        targetSdk 37
        versionCode 77
        versionName "6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Injected at build time; do not commit real keys to source control
        resValue "string", "google_maps_key", mapsApiKey
        manifestPlaceholders += [MAPS_API_KEY: mapsApiKey]
    }

    signingConfigs {
        release {
            storeFile file("signing/my-weather-app-keystore.jks")
            storePassword "Evyatarcohen1"
            keyAlias "myweatheappupload"
            keyPassword "Evyatarcohen1"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }

    dataBinding {
        enabled = true
    }
    namespace 'com.evya.myweatherapp'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.airbnb.android:lottie:6.7.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:$coroutines"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.github.ismaeldivita:chip-navigation-bar:1.4.0'

    // Google Maps
    api 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.google.android.libraries.places:places:5.3.0'

    // Hilt dependencies
    implementation "com.google.dagger:hilt-android:${rootProject.ext.hilt}"
    kapt "com.google.dagger:hilt-android-compiler:${rootProject.ext.hilt}"

    // Fragments
    implementation 'androidx.fragment:fragment-ktx:1.9.0'

    // Hilt testing dependencies
    androidTestImplementation "com.google.dagger:hilt-android-testing:${rootProject.ext.hilt}"
    kaptAndroidTest "com.google.dagger:hilt-android-compiler:${rootProject.ext.hilt}"

    //Lifecycle
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle"

    //Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutines"

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit"
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.5.0'

    // Navigation
    implementation "androidx.navigation:navigation-fragment-ktx:$navigation"
    implementation "androidx.navigation:navigation-ui-ktx:$navigation"

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-crashlytics'

    // Room
    implementation "androidx.room:room-ktx:$room"
    kapt "androidx.room:room-compiler:$room"

    // Google Ads
    implementation "com.google.android.gms:play-services-ads:$play_services_ads"

    // Widget background refresh
    implementation "androidx.work:work-runtime-ktx:2.10.5"
}